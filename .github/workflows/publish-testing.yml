name: Publish Testing

concurrency:
  group: publish-testing
  cancel-in-progress: true

on:
  workflow_dispatch:
    inputs:
      force:
        description: Publish even if there are no new commits since the last successful testing publish.
        required: false
        default: false
        type: boolean
  schedule:
  - cron: '0 10 * * *'

jobs:
  check-changes:
    name: Check for changes since last publish
    if: github.event.inputs.force != 'true'
    runs-on: ubuntu-latest
    outputs:
      should_publish: ${{ steps.compare.outputs.should_publish }}

    steps:
    - uses: actions/checkout@v7
      with:
        sparse-checkout: Tools

    - name: Get last publish SHA
      id: last-publish
      continue-on-error: true
      run: Tools/actions_get_last_publish_sha.py
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Check for changes
      id: compare
      env:
        LAST_PUBLISH_SHA: ${{ steps.last-publish.outputs.last_publish_sha }}
        CURRENT_SHA: ${{ github.sha }}
      run: |
        echo "Current commit: ${CURRENT_SHA}"
        echo "Last publish commit: ${LAST_PUBLISH_SHA:-unknown}"

        if [ -z "${LAST_PUBLISH_SHA:-}" ]; then
          echo "Could not determine the last published commit, publishing anyway."
          echo "should_publish=true" >> "$GITHUB_OUTPUT"
        elif [ "${LAST_PUBLISH_SHA}" = "${CURRENT_SHA}" ]; then
          echo "${CURRENT_SHA} was already published, nothing changed since then. Skipping publish."
          echo "should_publish=false" >> "$GITHUB_OUTPUT"
        else
          echo "should_publish=true" >> "$GITHUB_OUTPUT"
        fi

  build:
    needs: check-changes
    if: github.event.inputs.force == 'true' || needs.check-changes.outputs.should_publish == 'true'
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
      with:
        submodules: 'recursive'
        fetch-depth: 0
        filter: blob:none
    - name: Setup .NET Core
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: 10.0.x

    - name: Install dependencies
      run: sudo apt-get install -y python3-paramiko python3-lxml

    - name: Get Engine Tag
      run: |
        cd RobustToolbox
        git fetch --depth=1

    - name: Install dependencies
      run: dotnet restore

    - name: Update changelog
      run: |
        dotnet tool install --global SpaceWizards.ChangelogTool --version 1.0.8
        ss14-changelog update -d Resources/Changelog
      env:
        REPO: ${{ github.repository }}
        BRANCH: master
        CHANGELOG_REPO_PATH: Resources/Changelog
        EXTRA_CATEGORIES: Admin,Maps,Rules
        GITHUB_TOKEN: ${{ secrets.CL_ACCESS_TOKEN }}

    - name: Build Packaging
      run: dotnet build Content.Packaging --configuration Release --no-restore /m

    - name: Package server
      run: dotnet run --project Content.Packaging server --platform win-x64 --platform win-arm64 --platform linux-x64 --platform linux-arm64 --platform osx-x64 --platform osx-arm64

    - name: Package client
      run: dotnet run --project Content.Packaging client --no-wipe-release

    - name: Publish version
      run: Tools/publish_multi_request.py --fork-id wizards-testing
      env:
        PUBLISH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
        GITHUB_REPOSITORY: ${{ vars.GITHUB_REPOSITORY }}

    - name: Publish changelog (RSS)
      continue-on-error: true
      run: Tools/actions_changelog_rss.py
      env:
        CHANGELOG_RSS_KEY: ${{ secrets.CHANGELOG_RSS_KEY }}
